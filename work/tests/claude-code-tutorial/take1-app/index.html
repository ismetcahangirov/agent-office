<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f1115">
  <title>Focus Timer</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body data-mode="focus">
  <main class="app">
    <header class="header">
      <h1 class="brand">Focus Timer</h1>
      <span class="pill" id="modePill">Focus</span>
    </header>

    <section class="card timer-card" aria-label="Timer">
      <div class="ring-wrap">
        <svg class="ring" viewBox="0 0 120 120" aria-hidden="true">
          <circle class="ring-track" cx="60" cy="60" r="54"></circle>
          <circle class="ring-progress" id="ringProgress" cx="60" cy="60" r="54"></circle>
        </svg>
        <div class="time" id="time" role="timer" aria-live="off">25:00</div>
      </div>
      <p class="current-task" id="currentTask">No task selected</p>

      <div class="controls">
        <button class="btn btn-primary" id="startBtn" type="button">Start</button>
        <button class="btn btn-secondary" id="resetBtn" type="button">Reset</button>
      </div>
      <button class="link-btn" id="skipBtn" type="button">Skip to break</button>
    </section>

    <section class="card tasks-card" aria-label="Tasks">
      <h2 class="section-title">Tasks</h2>
      <form class="add-form" id="addForm" autocomplete="off">
        <input class="input" id="taskInput" type="text" placeholder="What are you working on?" maxlength="120" aria-label="New task">
        <button class="btn btn-add" type="submit" aria-label="Add task">+</button>
      </form>
      <ul class="task-list" id="taskList"></ul>
      <p class="empty" id="emptyMsg">No tasks yet. Add one above.</p>
    </section>
  </main>
</body>
</html>
